name: Feature
description: Deliverable feature within an epic
title: "[Feature] "
labels:
  - "Type: Feature"
  - "Status: To do"
body:
  - type: input
    id: epic_link
    attributes:
      label: Parent epic
      description: Link the epic issue (if exists).
      placeholder: "#100"
    validations:
      required: false

  - type: input
    id: feature_summary
    attributes:
      label: Feature summary
      description: Short description of the capability.
      placeholder: "Bulk upload of loan accounts..."
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Details
      description: What does this feature do? Any constraints?
      placeholder: |
        This feature will allow...
    validations:
      required: true

  - type: textarea
    id: stories
    attributes:
      label: Stories (linked issues)
      description: Link user stories as a checklist.
      placeholder: |
        - [ ] #201 As a RM, I can upload a CSV...
        - [ ] #202 As an analyst, I can view validation errors...
    validations:
      required: false
