name: Epic
description: Iniciativa amplia agrupando features e historias (QUÉ)
title: "[Epic] "
labels:
  - "Type: Epic"
  - "Status: To do"
body:
  - type: input
    id: epic_outcome
    attributes:
      label: Epic outcome
      description: ¿Cuál es el beneficio que quieres obtener con esta iniciativa?
      placeholder: "Mejorar la experiencia de uso de la aplicación para atraer mas clientes"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / context
      description: Describe la situación actual y porque se necesita
      placeholder: |
        Hoy en día, los clientes enfrentan ...
    validations:
      required: false

  - type: textarea
    id: features
    attributes:
      label: Features (linked issues)
      description: Vincula los features como un checklist. Convierte cada uno en un issue conforme se requiera.
      placeholder: |
        - [ ] #123 Self-service onboarding
        - [ ] #124 Revenue analytics dashboard
    validations:
      required: false

  - type: textarea
    id: success_metrics
    attributes:
      label: Success metrics
      description: ¿Cómo medirás si la iniciativa resultó exitosa? 
      placeholder: |
        - NPS +10
        - Reducción en tiempo de -30%
    validations:
      required: false